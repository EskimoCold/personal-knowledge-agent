[project]
name = "personal-knowledge-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy[asyncio]>=2.0.16,<3",
    "structlog>=26.1,<27",
    "trafilatura>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
local-model = ["llama-cpp-python==0.3.37"]
