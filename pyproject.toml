[project]
name = "personal-knowledge-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "jinja2>=3.1.6,<4",
    "pillow>=12,<13",
    "python-multipart>=0.0.26,<1",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy[asyncio]>=2.0.16,<3",
    "structlog>=26.1,<27",
    "trafilatura>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
local-model = ["llama-cpp-python==0.3.37"]
local-embeddings = [
    "sentence-transformers[image]>=6.1,<7",
    "torch>=2.8,<3",
    "torchvision>=0.23,<1",
    "transformers>=5.21.1,<6",
]
local-embeddings-cuda = [
    "sentence-transformers[image]>=6.1,<7",
    "torch>=2.8,<3",
    "torchvision>=0.23,<1",
    "transformers>=5.21.1,<6",
]

[tool.uv]
conflicts = [[{ extra = "local-embeddings" }, { extra = "local-embeddings-cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "local-embeddings", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu132", extra = "local-embeddings-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "local-embeddings", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu132", extra = "local-embeddings-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17,<1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
