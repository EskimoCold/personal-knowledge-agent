name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: pka
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pka
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pka -d pka"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.8
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
        env:
          PKA_TEST_DATABASE_URL: postgresql://pka:test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pka
